<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Віртуальне портфоліо</title>

    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <style>
      html, body { margin:0; height:100%; overflow:hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
      
      /* ПРИЦІЛ: Видно у вікні, зникає у FullScreen (щоб не дублювати системний) */
      #crosshair {
        position: fixed; top: 50%; left: 50%; width: 12px; height: 12px;
        background: rgba(0, 255, 255, 0.9); border: 2px solid white;
        border-radius: 50%; transform: translate(-50%, -50%);
        pointer-events: none; z-index: 100;
        box-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
      }
      :fullscreen #crosshair { display: none; }
      :-webkit-full-screen #crosshair { display: none; }

      /* ТА САМА СИНЯ ПАНЕЛЬ */
      #infoPanel {
        position: fixed; right: 16px; top: 16px;
        width: min(360px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
        overflow: auto; background: rgba(18, 18, 18, 0.95);
        color: #fff; border: 1px solid rgba(0, 255, 255, 0.4);
        border-radius: 12px; padding: 14px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.5);
        display: none; z-index: 2000;
        backdrop-filter: blur(8px);
      }
      #infoPanel h3 { margin: 0 0 6px 0; font-size: 18px; color: #00ffff; }
      #infoPanel .meta { opacity: .8; font-size: 13px; margin-bottom: 10px; }
      #infoPanel .desc { font-size: 14px; line-height: 1.4; white-space: pre-wrap; }
      #infoPanel .closeRow { display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px; }
      #infoPanel button {
        appearance:none; border:0; padding: 6px 12px; border-radius: 8px;
        background: #00ffff; color:#000; font-weight: bold; cursor:pointer;
      }
      #hint {
        position: fixed; left: 16px; bottom: 16px;
        padding: 10px; border-radius: 12px;
        background: rgba(255,255,255,0.9); color: #111;
        font-size: 13px; z-index: 10;
      }
    </style>
  </head>

  <body>

    <div id="crosshair"></div>

    <div id="infoPanel">
      <div class="closeRow">
        <div style="font-weight:600; color: #00ffff;">Інформація</div>
        <button id="closeInfo" type="button">Закрити ✕</button>
      </div>
      <h3 id="infoTitle">—</h3>
      <div class="meta" id="infoMeta">—</div>
      <div class="desc" id="infoDesc">—</div>
    </div>

    <div id="hint">
      <code>W A S D</code> — рух, <code>миша</code> — огляд, <b>Центральний клік</b> — опис.
    </div>

    <a-scene renderer="colorManagement: true" background="color: #101010">
      
      <a-entity id="rig" position="0 0 0">
        <a-camera id="camera" wasd-controls="acceleration: 15" look-controls="pointerLockEnabled: true">
          
          <!-- ГОЛОВНЕ ВИПРАВЛЕННЯ: Курсор, який працює у FullScreen -->
          <a-entity cursor="fuse: false; rayOrigin: entity"
                    raycaster="objects: .clickable; far: 20"
                    position="0 0 -1"
                    geometry="primitive: circle; radius: 0.001"
                    material="color: #00ffff; shader: flat; opacity: 0.5">
          </a-entity>

        </a-camera>
      </a-entity>

      <a-entity id="lights"></a-entity>
      <a-entity id="room" position="0 0 0"></a-entity>

    </a-scene>

    <script type="module" src="./app.js"></script>
  </body>
</html>
